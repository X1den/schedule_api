services:
  db:
    image: postgres:17
    container_name: schedule_db
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule_user -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: